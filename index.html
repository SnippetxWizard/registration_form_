<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechCode Event Registration</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #0404f5, #03bbfe);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .registration-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1rem;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-group select {
            appearance: none;
            cursor: pointer;
        }

        .form-group select option {
            background: #020912;
            color: #fff;
        }

        .form-group .event-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-group .event-checkbox input {
            width: auto;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background: #0056b3;
        }

        @media (max-width: 480px) {
            .registration-container {
                padding: 20px;
            }

            h2 {
                font-size: 1.5rem;
            }

            .form-group input,
            .form-group select {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="registration-container">
        <h2>Event Registration</h2>
        <form id="registration-form" action="/register" method="POST">

            <!-- Student Name -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <!-- Student Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <!-- Department -->
            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="" disabled selected>Select Department</option>
                    <option value="IT">Information Technology (IT)</option>
                    <option value="CS">Computer Science (CS)</option>
                </select>
            </div>

            <!-- Year -->
            <div class="form-group">
                <label for="year">Year</label>
                <select id="year" name="year" required>
                    <option value="" disabled selected>Select Year</option>
                    <option value="FY">First Year (FY)</option>
                    <option value="SY">Second Year (SY)</option>
                    <option value="TY">Third Year (TY)</option>
                </select>
            </div>

            <!-- Event Selection -->
            <div class="form-group">
                <label>Select Events</label>
                <div class="event-checkbox">
                    <input type="checkbox" id="code-in-dark" name="event" value="Code in Dark">
                    <label for="code-in-dark">Code in Dark</label>
                </div>
                <div class="event-checkbox">
                    <input type="checkbox" id="debugging" name="event" value="Debugging">
                    <label for="debugging">Debugging</label>
                </div>
                <div class="event-checkbox">
                    <input type="checkbox" id="uiux" name="event" value="UI/UX Design">
                    <label for="uiux">UI/UX Design</label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>

    <script>
        // Form Submission Handling
        document.getElementById('registration-form').addEventListener('submit', function (e) {
            e.preventDefault();

            // Get Form Data
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const department = document.getElementById('department').value;
            const year = document.getElementById('year').value;
            const events = [];
            document.querySelectorAll('input[name="event"]:checked').forEach(event => {
                events.push(event.value);
            });

            // Validate Events Selection
            if (events.length === 0) {
                alert('Please select at least one event.');
                return;
            }

            // Display Registration Details
            const message = `
                Registration Successful!
                Name: ${name}
                Email: ${email}
                Department: ${department}
                Year: ${year}
                Events: ${events.join(', ')}
            `;
            alert(message);

            // Reset Form
            document.getElementById('registration-form').reset();
        });
    </script>
</body>

</html>
